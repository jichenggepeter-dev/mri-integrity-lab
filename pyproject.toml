[project]
name = "mri-integrity-lab"
version = "0.1.0"
description = "CPU-friendly PyTorch research prototype for brain MRI classification and image-integrity screening."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Jicheng Ge" },
]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=10.4",
  "scikit-learn>=1.5",
  "streamlit>=1.37",
  "torch>=2.5",
  "torchvision>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
mri-integrity = "mri_integrity_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_integrity_lab"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

